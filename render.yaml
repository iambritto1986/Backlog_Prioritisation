services:
  - type: web
    name: product-planner
    env: node
    plan: pro
    buildCommand: npm install && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # DATABASE_URL is set manually in the Render dashboard (Environment tab),
      # not here, so the connection string never lands in git history.
